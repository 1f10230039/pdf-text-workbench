[project]
name = "pdf-text-workbench"
version = "1.0.0"
description = "PDF文書を、再現可能・監査可能な形でテキスト化するためのローカルWebワークベンチ"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# E741: 幾何計算で l（line）を多用しているため許容。E731: 短い述語の lambda 代入を許容
ignore = ["E741", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
